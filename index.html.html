<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="サーガラ予約">
<meta name="theme-color" content="#F5F0EB">
<meta name="mobile-web-app-capable" content="yes">
<title>サーガラ各種予約</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@600&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F5F0EB;
    --surface:#FDFAF7;
    --surface2:#EDE8E2;
    --border:#DDD6CE;
    --border-hi:#C4B9AE;
    --brown:#7B5C45;
    --brown-dim:#A07858;
    --brown-light:#C4A882;
    --text:#2C2018;
    --text-sub:#7A6558;
    --text-muted:#B0A090;
    --danger:#C0392B;
    --success:#3A7D5E;
    --white:#FDFAF7;
    --radius:14px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{height:-webkit-fill-available;}
  body{margin:0;font-family:'Zen Maru Gothic',-apple-system,'Hiragino Maru Gothic Pro','Yu Gothic',sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;min-height:100vh;min-height:-webkit-fill-available;overscroll-behavior:none;}
  input,textarea,select{font-size:16px!important;}
  button{-webkit-appearance:none;touch-action:manipulation;}
  #app{max-width:560px;margin:0 auto;padding-bottom:calc(56px + var(--safe-bottom));min-height:100vh;background:var(--bg);}

  /* Header */
  .header{background:var(--surface);padding:calc(16px + var(--safe-top)) 20px 16px 60px;position:relative;border-bottom:1px solid var(--border);}
  .header__eyebrow{font-size:10px;letter-spacing:.18em;color:var(--brown-dim);text-transform:uppercase;margin:0 0 4px;font-weight:500;}
  .header__title{font-family:'Noto Serif JP',serif;font-weight:600;font-size:20px;letter-spacing:.08em;margin:0;color:var(--text);}
  .gear{position:absolute;top:calc(14px + var(--safe-top));left:14px;background:none;border:1px solid var(--border-hi);border-radius:8px;color:var(--text-sub);font-size:15px;cursor:pointer;width:34px;height:34px;display:flex;align-items:center;justify-content:center;}
  .gear:hover{border-color:var(--brown);color:var(--brown);}
  .mypage-btn{position:absolute;top:calc(12px + var(--safe-top));right:14px;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:1px solid var(--border-hi);border-radius:10px;padding:5px 10px;cursor:pointer;font-family:inherit;transition:border-color .15s;}
  .mypage-btn:hover{border-color:var(--brown);}
  .mypage-btn--login{border-color:var(--brown-light);}
  .mypage-btn__icon{font-size:16px;line-height:1;}
  .mypage-btn__name{font-size:9px;font-weight:700;color:var(--text-sub);white-space:nowrap;}
  .mypage-btn--login .mypage-btn__name{color:var(--brown);}

  /* Tabs */
  .tabs{display:flex;background:var(--surface);border-bottom:2px solid var(--border);padding:0 12px;gap:4px;}
  .tab{flex:1;text-align:center;padding:12px 4px;line-height:1.35;font-weight:500;color:var(--text-muted);background:none;border:none;border-bottom:2px solid transparent;margin-bottom:-2px;cursor:pointer;position:relative;font-family:inherit;transition:color .18s;}
  .tab__top{display:block;font-size:10px;letter-spacing:.05em;}
  .tab__bottom{display:block;font-size:13px;margin-top:2px;font-weight:700;}
  .tab.is-active{color:var(--text);}
  .tab.is-active .tab__bottom{color:var(--brown);}
  .tab.is-active{border-bottom-color:var(--brown);}

  /* Date nav */
  .date-nav{display:flex;align-items:center;gap:8px;padding:14px 16px 6px;}
  .date-nav__arrow{border:1px solid var(--border-hi);background:var(--surface);width:34px;height:34px;border-radius:8px;font-size:16px;color:var(--text-sub);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:border-color .15s,color .15s;}
  .date-nav__arrow:hover:not(:disabled){border-color:var(--brown);color:var(--brown);}
  .date-nav__arrow:disabled{opacity:.3;cursor:default;}
  .date-nav__today{margin-left:auto;font-size:11px;letter-spacing:.06em;color:var(--brown);border:1px solid var(--brown-light);background:transparent;border-radius:20px;padding:6px 14px;cursor:pointer;font-family:inherit;font-weight:700;transition:background .15s;}
  .date-nav__today:hover{background:rgba(123,92,69,.08);}
  .date-strip{display:flex;gap:6px;padding:6px 16px 14px;overflow-x:auto;}
  .day-chip{flex:1 0 auto;min-width:46px;border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:6px 4px 8px;text-align:center;cursor:pointer;font-family:inherit;transition:border-color .15s,background .15s;}
  .day-chip:hover{border-color:var(--brown-light);}
  .day-chip__wd{font-size:10px;color:var(--text-muted);display:block;letter-spacing:.05em;}
  .day-chip__d{font-size:15px;font-weight:700;display:block;margin-top:2px;color:var(--text-sub);}
  .day-chip.is-today .day-chip__d{color:var(--brown);}
  .day-chip.is-selected{background:var(--brown);border-color:var(--brown);}
  .day-chip.is-selected .day-chip__wd{color:rgba(255,255,255,.7);}
  .day-chip.is-selected .day-chip__d{color:#fff;}

  .selected-date-label{padding:2px 16px 6px;font-size:12px;color:var(--text-sub);letter-spacing:.04em;}

  /* Model pills */
  .model-row{display:flex;gap:8px;padding:6px 16px 4px;}
  .model-pill{flex:1;border:1px solid var(--border-hi);background:var(--surface);color:var(--text-sub);border-radius:30px;padding:10px 8px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .15s;text-align:center;}
  .model-pill:hover{border-color:var(--brown);color:var(--brown);}
  .model-pill.is-active{background:var(--brown);border-color:var(--brown);color:#fff;}
  .model-pill__note{display:block;font-size:10px;font-weight:500;margin-top:2px;opacity:.75;}

  /* Slot cards */
  .slots{display:flex;flex-direction:column;gap:10px;padding:10px 16px 6px;}
  .slot-card{border:1px solid var(--border);border-radius:var(--radius);padding:16px;background:var(--surface);transition:border-color .15s;box-shadow:0 1px 4px rgba(123,92,69,.06);}
  .slot-card:hover{border-color:var(--brown-light);}
  .slot-card__head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .slot-card__label{font-weight:700;font-size:15px;color:var(--text);letter-spacing:.02em;}
  .slot-card__remaining{font-size:12px;font-weight:700;letter-spacing:.03em;}
  .slot-card__remaining.is-open{color:var(--success);}
  .slot-card__remaining.is-full{color:var(--danger);}
  .berths{margin:4px 0 12px;display:flex;gap:5px;flex-wrap:wrap;}
  .berth{width:14px;height:20px;border:1.5px solid var(--border-hi);border-radius:3px;display:inline-block;}
  .berth--full{background:var(--brown-light);border-color:var(--brown-light);}

  /* Buttons */
  .btn{font-family:inherit;border:none;border-radius:10px;padding:12px 16px;font-size:14px;font-weight:700;cursor:pointer;letter-spacing:.03em;transition:opacity .15s,transform .1s;}
  .btn:active{transform:scale(.97);}
  .btn--primary{background:var(--brown);color:#fff;}
  .btn--primary:hover{opacity:.88;}
  .btn--primary:disabled{background:var(--surface2);color:var(--text-muted);cursor:default;transform:none;}
  .btn--block{width:100%;}
  .btn--ghost{background:transparent;color:var(--brown);border:1px solid var(--brown-light);}
  .btn--ghost:hover{border-color:var(--brown);background:rgba(123,92,69,.06);}
  .btn--danger{background:var(--danger);color:#fff;}
  .btn--sm{padding:7px 11px;font-size:12px;border-radius:8px;}

  /* Booking list */
  .section-title{font-size:11px;font-weight:700;color:var(--text-muted);padding:18px 16px 8px;letter-spacing:.1em;text-transform:uppercase;}
  .booking-list{padding:0 16px;display:flex;flex-direction:column;gap:8px;}
  .booking-row{border:1px solid var(--border);border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:12px;background:var(--surface);box-shadow:0 1px 3px rgba(123,92,69,.05);}
  .booking-row__slot{font-size:11px;font-weight:700;color:#fff;background:var(--brown);border-radius:6px;padding:4px 9px;white-space:nowrap;letter-spacing:.03em;}
  .booking-row__main{flex:1;min-width:0;}
  .booking-row__name{font-size:14px;font-weight:700;color:var(--text);}
  .booking-row__meta{font-size:12px;color:var(--text-sub);margin-top:2px;}
  .empty-note{padding:16px 16px;font-size:13px;color:var(--text-muted);}
  .confirm-box{display:flex;align-items:center;gap:6px;}
  .confirm-box span{font-size:12px;color:var(--danger);font-weight:700;}

  /* Modal */
  .overlay{position:fixed;inset:0;background:rgba(44,32,24,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50;backdrop-filter:blur(3px);}
  .modal{background:var(--surface);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:24px 20px calc(32px + var(--safe-bottom));max-height:88vh;overflow-y:auto;border-top:2px solid var(--brown-light);}
  .modal__title{font-family:'Noto Serif JP',serif;font-size:18px;font-weight:700;margin:0 0 4px;color:var(--text);}
  .modal__sub{font-size:12px;color:var(--text-sub);margin:0 0 20px;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:11px;font-weight:700;color:var(--text-sub);margin-bottom:6px;letter-spacing:.06em;text-transform:uppercase;}
  .field input[type=time]{color-scheme:light;}
  .field input,.field textarea{width:100%;border:1px solid var(--border-hi);border-radius:10px;padding:12px 14px;font-size:14px;font-family:inherit;background:var(--bg);color:var(--text);}
  .field input[type=time]::-webkit-calendar-picker-indicator{filter:none;cursor:pointer;opacity:.6;}
  .field input:focus,.field textarea:focus{outline:none;border-color:var(--brown);box-shadow:0 0 0 3px rgba(123,92,69,.1);}
  .field textarea{resize:vertical;min-height:60px;}
  .field--req label::after{content:' *';color:var(--brown);}
  .modal__actions{display:flex;gap:10px;margin-top:8px;}
  .modal__actions .btn{flex:1;}
  .error-text{color:var(--danger);font-size:12px;margin:-10px 0 14px;display:none;}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);border:none;padding:12px 20px;border-radius:30px;font-size:13px;z-index:100;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap;box-shadow:0 4px 16px rgba(44,32,24,.2);}
  .toast--success{background:var(--brown);color:#fff;font-size:15px;font-weight:700;padding:14px 28px;box-shadow:0 4px 24px rgba(123,92,69,.4);}
  .toast.show{opacity:1;}
  .loading{padding:80px 20px;text-align:center;color:var(--text-muted);font-size:14px;}

  /* 混雑度 */
  .cong-bars{display:flex;gap:5px;margin:4px 0 12px;}
  .cong-bar{flex:1;height:10px;border-radius:3px;background:var(--border);}
  .cong-bar.is-open{background:var(--success);}
  .cong-bar.is-moderate{background:#C4962A;}
  .cong-bar.is-busy{background:var(--danger);}
  .slot-card__remaining.is-moderate{color:#C4962A;}
  .slot-card__remaining.is-busy{color:var(--danger);}
  .cong-count{font-size:11px;color:var(--text-muted);margin:-6px 0 12px;letter-spacing:.03em;}

  /* 管理カレンダー */
  .adm-tabs{display:flex;gap:0;border-bottom:1px solid var(--border);}
  .adm-tab{flex:1;padding:12px;text-align:center;font-size:13px;font-weight:700;color:var(--text-muted);background:none;border:none;cursor:pointer;font-family:inherit;border-bottom:2px solid transparent;}
  .adm-tab.is-active{color:var(--brown);border-bottom-color:var(--brown);}
  .cal-nav{display:flex;align-items:center;padding:14px 16px 8px;}
  .cal-nav__arrow{background:none;border:1px solid var(--border-hi);color:var(--text-sub);width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:16px;}
  .cal-nav__arrow:hover{border-color:var(--brown);color:var(--brown);}
  .cal-nav__label{flex:1;text-align:center;font-size:15px;font-weight:700;color:var(--text);}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;padding:0 10px 16px;}
  .cal-wd{text-align:center;font-size:10px;color:var(--text-muted);padding:4px 0;font-weight:700;}
  .cal-cell{border-radius:8px;padding:5px 3px 6px;cursor:pointer;background:var(--surface);border:1px solid var(--border);min-height:62px;transition:border-color .15s;}
  .cal-cell:hover{border-color:var(--brown-light);}
  .cal-cell.is-today{border-color:var(--brown-dim);}
  .cal-cell.is-empty{background:transparent;border-color:transparent;cursor:default;}
  .cal-cell.is-selected{border-color:var(--brown);background:rgba(123,92,69,.06);}
  .cal-cell__d{font-size:12px;font-weight:700;color:var(--text-sub);text-align:center;display:block;}
  .cal-cell.is-today .cal-cell__d{color:var(--brown);}
  .cal-dots{display:flex;flex-direction:column;gap:2px;margin-top:4px;}
  .cal-dot{border-radius:3px;padding:1px 3px;font-size:9px;font-weight:700;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .cal-dot--storage{background:rgba(58,125,94,.15);color:var(--success);}
  .cal-dot--rental{background:rgba(123,92,69,.15);color:var(--brown);}

  /* 管理日別詳細 */
  .adm-day-header{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;}
  .adm-back{background:none;border:1px solid var(--border-hi);color:var(--text-sub);border-radius:8px;padding:6px 12px;font-size:12px;cursor:pointer;font-family:inherit;}
  .adm-back:hover{border-color:var(--brown);color:var(--brown);}
  .adm-day-title{font-size:15px;font-weight:700;color:var(--text);flex:1;}
  .adm-booking-section{padding:0 14px 8px;}
  .adm-section-label{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted);margin:14px 0 8px;}
  .adm-booking-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:8px;box-shadow:0 1px 3px rgba(123,92,69,.05);}
  .adm-booking-card.is-confirmed{border-color:var(--success);}
  .adm-booking-card.is-cancelled{opacity:.45;}
  .adm-card-head{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
  .adm-badge{font-size:10px;font-weight:700;padding:3px 8px;border-radius:4px;white-space:nowrap;}
  .adm-badge--storage{background:rgba(58,125,94,.15);color:var(--success);}
  .adm-badge--rental{background:rgba(123,92,69,.15);color:var(--brown);}
  .adm-badge--confirmed{background:rgba(58,125,94,.2);color:var(--success);}
  .adm-badge--pending{background:rgba(123,92,69,.1);color:var(--brown-dim);}
  .adm-name{font-size:14px;font-weight:700;color:var(--text);}
  .adm-meta{font-size:12px;color:var(--text-sub);margin-bottom:8px;line-height:1.6;}
  .adm-card-actions{display:flex;gap:8px;}
  .adm-empty{padding:20px 14px;font-size:13px;color:var(--text-muted);}

  /* 管理者パネル */
  .admin-overlay{position:fixed;inset:0;background:rgba(44,32,24,.55);display:flex;align-items:center;justify-content:center;z-index:200;backdrop-filter:blur(4px);}
  .admin-card{background:var(--surface);border:1px solid var(--border-hi);border-radius:20px;padding:28px 24px;width:90%;max-width:420px;box-shadow:0 8px 32px rgba(44,32,24,.18);}
  .admin-card__title{font-family:'Noto Serif JP',serif;font-size:18px;font-weight:700;color:var(--brown);margin:0 0 4px;}
  .admin-card__sub{font-size:12px;color:var(--text-muted);margin:0 0 20px;}
  .admin-panel{position:fixed;inset:0;background:var(--bg);z-index:180;overflow-y:auto;}
  .admin-panel__header{background:var(--surface);border-bottom:1px solid var(--border);padding:calc(16px + var(--safe-top)) 18px 16px;display:flex;align-items:center;gap:12px;}
  .admin-panel__title{font-family:'Noto Serif JP',serif;font-size:18px;font-weight:700;color:var(--brown);margin:0;flex:1;}
  .admin-panel__logout{font-size:12px;color:var(--text-sub);background:none;border:1px solid var(--border-hi);border-radius:8px;padding:6px 12px;cursor:pointer;font-family:inherit;}
  .admin-section{margin:18px 16px 0;}
  .admin-section__title{font-size:10px;font-weight:700;letter-spacing:.12em;color:var(--text-muted);text-transform:uppercase;margin:0 0 10px;}
  .admin-row{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;display:flex;align-items:center;gap:12px;margin-bottom:8px;}
  .admin-row__label{flex:1;font-size:14px;color:var(--text);}
  .admin-row__label small{display:block;font-size:11px;color:var(--text-muted);margin-top:2px;}
  .admin-row input[type=number]{width:70px;background:var(--surface2);border:1px solid var(--border-hi);border-radius:8px;padding:8px 10px;font-size:15px;font-weight:700;color:var(--text);text-align:center;font-family:inherit;}
  .admin-row input[type=number]:focus{outline:none;border-color:var(--gold);}
  .admin-divider{height:1px;background:var(--border);margin:20px 16px 0;}
  .admin-error{font-size:12px;color:var(--danger);margin:-4px 0 10px;display:none;}
  .admin-row input[type=number]:focus{outline:none;border-color:var(--brown);}

  /* 同伴者カウンター */
  .counter-row{display:flex;align-items:center;gap:12px;margin-top:4px;}
  .counter-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--brown-light);background:var(--bg);color:var(--brown);font-size:18px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;}
  .counter-btn:hover{border-color:var(--brown);background:rgba(123,92,69,.08);}
  .counter-val{font-size:22px;font-weight:700;color:var(--text);min-width:28px;text-align:center;}
  .counter-unit{font-size:13px;color:var(--text-sub);}

  /* 選択グループ（ラジオ） */
  .select-group{display:flex;flex-direction:column;gap:8px;margin-top:4px;}
  .sel-item{display:flex;align-items:center;gap:10px;background:var(--bg);border:1px solid var(--border-hi);border-radius:10px;padding:11px 14px;cursor:pointer;}
  .sel-item input[type=radio]{width:18px;height:18px;accent-color:var(--brown);cursor:pointer;flex-shrink:0;}
  .sel-label{font-size:13px;font-weight:500;color:var(--text);}
  .sel-item:has(input:checked){border-color:var(--brown);background:rgba(123,92,69,.06);}

  /* オプション選択 */
  .options-grid{display:flex;flex-direction:column;gap:8px;margin-top:4px;}
  .opt-item{display:flex;align-items:center;gap:10px;background:var(--bg);border:1px solid var(--border-hi);border-radius:10px;padding:11px 14px;cursor:pointer;}
  .opt-item input[type=checkbox]{width:18px;height:18px;accent-color:var(--brown);cursor:pointer;flex-shrink:0;}
  .opt-label{font-size:13px;font-weight:500;color:var(--text);}
  .opt-item:has(input:checked){border-color:var(--brown);background:rgba(123,92,69,.06);}
  .booking-row__opts{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px;}
  .opt-tag{font-size:10px;font-weight:700;background:rgba(123,92,69,.12);color:var(--brown);border-radius:4px;padding:2px 6px;}

  /* キャンセルポリシー */
  .cancel-tel{display:inline-block;font-size:11px;font-weight:700;color:var(--brown);border:1px solid var(--brown-light);border-radius:8px;padding:5px 8px;text-align:center;line-height:1.3;text-decoration:none;white-space:nowrap;}
  .cancel-tel:hover{background:rgba(200,169,110,.1);}
  .cancel-notice{margin:10px 0 4px;padding:12px 14px;background:rgba(123,92,69,.05);border:1px solid var(--brown-light);border-radius:10px;font-size:12px;color:var(--text-sub);line-height:1.7;}
  .cancel-tel-link{color:var(--brown);font-weight:700;font-size:14px;text-decoration:none;display:inline-block;margin-top:4px;}
  .cancel-tel-link:hover{opacity:.8;}

  /* マイページパネル */
  .mypage-panel{position:fixed;inset:0;background:var(--bg);z-index:180;overflow-y:auto;}
  .mypage-header{background:var(--surface);border-bottom:1px solid var(--border);padding:calc(18px + var(--safe-top)) 18px 14px;display:flex;align-items:center;gap:12px;}
  .mypage-header__title{font-family:'Noto Serif JP',serif;font-size:17px;font-weight:700;color:var(--text);flex:1;}
  .mypage-header__close{font-size:12px;color:var(--text-sub);background:none;border:1px solid var(--border-hi);border-radius:8px;padding:6px 12px;cursor:pointer;font-family:inherit;}

  /* 認証 */
  .auth-wrap{padding:24px 20px;}
  .auth-switch{display:flex;gap:8px;margin-bottom:20px;}
  .auth-switch-btn{flex:1;padding:10px;border-radius:10px;border:1px solid var(--border-hi);background:var(--surface);color:var(--text-sub);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;}
  .auth-switch-btn.is-active{background:var(--brown);color:#fff;border-color:var(--brown);}
  .auth-lead{font-size:13px;color:var(--text-sub);margin:0 0 18px;}

  /* マイページ本体 */
  .mypage-tabs{display:flex;border-bottom:1px solid var(--border);background:var(--surface);}
  .mypage-tab{flex:1;padding:12px;text-align:center;font-size:13px;font-weight:700;color:var(--text-muted);background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;font-family:inherit;}
  .mypage-tab.is-active{color:var(--brown);border-bottom-color:var(--brown);}
  .mypage-section{padding:16px;}
  .mypage-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:10px;box-shadow:0 1px 3px rgba(123,92,69,.05);}
  .mypage-card__head{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
  .mypage-card__type{font-size:10px;font-weight:700;padding:3px 8px;border-radius:4px;}
  .mypage-card__type--storage{background:rgba(58,125,94,.15);color:var(--success);}
  .mypage-card__type--rental{background:rgba(123,92,69,.15);color:var(--brown);}
  .mypage-card__status{font-size:10px;font-weight:700;padding:3px 8px;border-radius:4px;}
  .mypage-card__status--pending{background:rgba(196,168,130,.2);color:#8B6914;}
  .mypage-card__status--confirmed{background:rgba(58,125,94,.2);color:var(--success);}
  .mypage-card__date{font-size:15px;font-weight:700;color:var(--text);}
  .mypage-card__detail{font-size:12px;color:var(--text-sub);margin-top:4px;line-height:1.7;}
  .mypage-card__actions{margin-top:10px;display:flex;gap:8px;}
  .mypage-empty{padding:32px 16px;text-align:center;color:var(--text-muted);font-size:13px;}
  .mypage-profile-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--border);}
  .mypage-profile-row:last-child{border-bottom:none;}
  .mypage-profile-label{font-size:11px;color:var(--text-muted);font-weight:700;letter-spacing:.06em;}
  .mypage-profile-val{font-size:14px;color:var(--text);font-weight:500;}

</style>
</head>
<body>
<div id="app"><div class="loading">読み込み中です…</div></div>
<script>
(function(){
  "use strict";

  var BOOKINGS_KEY = 'marina_bookings_v1';
  var MEMBERS_KEY  = 'marina_members_v2';
  var SESSION_KEY  = 'marina_session_v2';
  var ADMIN_KEY = 'marina_admin_v1';
  var SETTINGS_KEY = 'marina_settings_v1';
  // 管理者認証情報はハッシュのみ保持（平文はコードに存在しない）
  var DEFAULT_ADMIN_HASH = {
    id: '9af15b336e6a9619928537df30b2e6a2376569fcf9d7e773eccede65606529a0',
    pw: '0ffe1abd1a08215353c233d6e009613e95eec4253832a761af28ff37ac5a150c'
  };
  var WEEKDAYS = ['日','月','火','水','木','金','土'];
  var SLOT_LABEL = {am:'午前', pm:'午後', day:'一日'};
  var TAB_LABEL = {
    storage: {top:'艇庫/揚降会員様', bottom:'揚降予約'},
    rental:  {top:'レンタル会員様',  bottom:'レンタル予約'}
  };
  var MODEL_LABEL = {seat2:'2人乗り', seat3:'3人乗り'};
  var MODEL_SLOTS  = {seat2:['am','pm'], seat3:['am','pm','day']};

  var state = {
    tab: 'storage',
    rentalModel: 'seat2',
    weekOffset: 0,
    selectedDate: toKey(new Date()),
    bookings: {rental:[], storage:[]},
    settings: {rental2Capacity:2, rental3Capacity:1, storageCapacity:5},
    modal: null,
    confirmingCancelId: null,
    admin: {id: DEFAULT_ADMIN_HASH.id, pw: DEFAULT_ADMIN_HASH.pw},
    settingsOpen: false,
    adminOpen: false,
    adminLogin: false,
    adminLoginError: '',
    adminPwSection: false,
    adminView: 'calendar',   // 'calendar' | 'day'
    adminCalMonth: null,     // {year, month} 表示中の月
    adminDayDate: null,      // 日別詳細で選択中の日付key
    adminConfirmCancel: null, // キャンセル確認中のid
    currentMember: null,   // ログイン中の会員
    authView: 'login',     // 'login' | 'register'
    authError: '',
    myPageOpen: false,
    myPageView: 'bookings', // 'bookings' | 'profile'
    myConfirmCancel: null,
    members: [],
    loaded: false
  };

  function toKey(d){
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }
  function addDays(d,n){var r=new Date(d);r.setDate(r.getDate()+n);return r;}
  function todayKey(){return toKey(new Date());}
  function fmtLabel(key){
    var p=key.split('-'),d=new Date(+p[0],+p[1]-1,+p[2]);
    return (+p[1])+'月'+(+p[2])+'日（'+WEEKDAYS[d.getDay()]+'）';
  }

  // SHA-256ハッシュ（Web Crypto API）
  function sha256(str){
    var buf = new TextEncoder().encode(str);
    return crypto.subtle.digest('SHA-256', buf).then(function(hash){
      return Array.from(new Uint8Array(hash)).map(function(b){return b.toString(16).padStart(2,'0');}).join('');
    });
  }

  // ---------- storage ----------
  // 起動時はlocalStorageから同期読み込み。window.storageへは保存時のみ非同期で試みる。
  var DEFAULT_SETTINGS = {rental2Capacity:1, rental3Capacity:4, storageCapacity:5};

  function lsGet(key){ try{ return localStorage.getItem(key); }catch(e){ return null; } }
  function lsSet(key,val){ try{ localStorage.setItem(key,val); }catch(e){} }

  function loadData(){
    try{
      var b=lsGet(BOOKINGS_KEY);
      state.bookings = b ? JSON.parse(b) : {rental:[],storage:[]};
    }catch(e){ state.bookings={rental:[],storage:[]}; }
    if(!state.bookings.rental)  state.bookings.rental  = [];
    if(!state.bookings.storage) state.bookings.storage = [];
    state.bookings.rental.forEach(function(b){if(!b.model) b.model='seat3';});
    state.bookings.storage.forEach(function(b){
      if(!b.time) b.time = b.slot==='pm'?'13:00':'09:00';
    });

    try{
      var mb=lsGet(MEMBERS_KEY);
      state.members=mb?JSON.parse(mb):[];
    }catch(e){state.members=[];}
    try{
      var ss=lsGet(SESSION_KEY);
      if(ss){
        var mid=JSON.parse(ss).id;
        var found=state.members.filter(function(m){return m.id===mid;})[0];
        if(found) state.currentMember=found;
      }
    }catch(e){}
    try{
      var ac=lsGet(ADMIN_KEY);
      state.admin = ac ? JSON.parse(ac) : Object.assign({},DEFAULT_ADMIN_HASH);
    }catch(e){ state.admin=Object.assign({},DEFAULT_ADMIN_HASH); }
    try{
      var s=lsGet(SETTINGS_KEY);
      var l=s?JSON.parse(s):{};
      state.settings={
        rental2Capacity: l.rental2Capacity!==undefined?l.rental2Capacity:(l.rentalCapacity||DEFAULT_SETTINGS.rental2Capacity),
        rental3Capacity: l.rental3Capacity!==undefined?l.rental3Capacity:DEFAULT_SETTINGS.rental3Capacity,
        storageCapacity: l.storageCapacity!==undefined?l.storageCapacity:DEFAULT_SETTINGS.storageCapacity
      };
    }catch(e){ state.settings=Object.assign({},DEFAULT_SETTINGS); }
  }

  function saveBookings(){
    lsSet(BOOKINGS_KEY, JSON.stringify(state.bookings));
    // window.storageが使えれば並行して保存（失敗しても無視）
    try{
      if(typeof window.storage!=='undefined' && window.storage.set)
        window.storage.set(BOOKINGS_KEY, JSON.stringify(state.bookings), true).catch(function(){});
    }catch(e){}
  }
  function saveMembers(){
    lsSet(MEMBERS_KEY,JSON.stringify(state.members));
  }
  function saveSession(id){
    lsSet(SESSION_KEY,JSON.stringify({id:id}));
  }
  function clearSession(){
    try{localStorage.removeItem('l_'+SESSION_KEY);}catch(e){}
  }

  function saveSettings(){
    lsSet(SETTINGS_KEY, JSON.stringify(state.settings));
    try{
      if(typeof window.storage!=='undefined' && window.storage.set)
        window.storage.set(SETTINGS_KEY, JSON.stringify(state.settings), true).catch(function(){});
    }catch(e){}
  }

  function getCapacity(type,model){
    if(type==='rental') return model==='seat2'?state.settings.rental2Capacity:state.settings.rental3Capacity;
    return state.settings.storageCapacity;
  }
  function getUsage(type,model,dateKey){
    var list=state.bookings[type].filter(function(b){
      return b.date===dateKey&&(type!=='rental'||b.model===model);
    });
    var am=0,pm=0;
    list.forEach(function(b){
      if(b.slot==='am'||b.slot==='day') am++;
      if(b.slot==='pm'||b.slot==='day') pm++;
    });
    return {am:am,pm:pm};
  }
  function getRemaining(type,model,dateKey,slot){
    var cap=getCapacity(type,model),u=getUsage(type,model,dateKey);
    if(slot==='am') return cap-u.am;
    if(slot==='pm') return cap-u.pm;
    return cap-Math.max(u.am,u.pm);
  }
  function getUsed(type,model,dateKey,slot){
    var u=getUsage(type,model,dateKey);
    if(slot==='am') return u.am;
    if(slot==='pm') return u.pm;
    return Math.max(u.am,u.pm);
  }

  var app=document.getElementById('app');

  function render(){
    if(!state.loaded){app.innerHTML='<div class="loading">読み込み中です…</div>';return;}
    var html='';
    html+=renderHeader();
    html+=renderTabs();
    html+=renderDateNav();
    if(state.tab==='rental') html+=renderModelRow();
    html+=renderSlots();
    html+=renderBookingList();
    app.innerHTML=html;
    if(state.modal)        app.insertAdjacentHTML('beforeend',renderModal());
    if(state.adminOpen)    app.insertAdjacentHTML('beforeend',renderAdminLayer());
    if(state.myPageOpen)   app.insertAdjacentHTML('beforeend',renderMyPageLayer());
  }

  function renderHeader(){
    var loginBtn=state.currentMember?
      '<button class="mypage-btn" data-action="open-mypage" title="マイページ">'+
        '<span class="mypage-btn__icon">&#128100;</span>'+
        '<span class="mypage-btn__name">'+escapeHtml(state.currentMember.name.split('　')[0].split(' ')[0])+'</span>'+
      '</button>':
      '<button class="mypage-btn mypage-btn--login" data-action="open-mypage" title="ログイン / 会員登録">'+
        '<span class="mypage-btn__icon">&#128100;</span>'+
        '<span class="mypage-btn__name">ログイン</span>'+
      '</button>';
    return '<div class="header">'+
      '<button class="gear" data-action="open-admin" title="管理者">&#9881;</button>'+
      '<p class="header__eyebrow">Sagara Marine</p>'+
      '<h1 class="header__title">サーガラ各種予約</h1>'+
      loginBtn+
    '</div>';
  }

  function renderTabs(){
    return '<div class="tabs">'+
      Object.keys(TAB_LABEL).map(function(key){
        return '<button class="tab '+(state.tab===key?'is-active':'')+'" data-action="switch-tab" data-tab="'+key+'">'+
          '<span class="tab__top">'+TAB_LABEL[key].top+'</span>'+
          '<span class="tab__bottom">'+TAB_LABEL[key].bottom+'</span>'+
        '</button>';
      }).join('')+
    '</div>';
  }

  function renderDateNav(){
    var html='<div class="date-nav">'+
      '<button class="date-nav__arrow" data-action="prev-week" '+(state.weekOffset<=0?'disabled':'')+'>&#8249;</button>'+
      '<button class="date-nav__arrow" data-action="next-week" '+(state.weekOffset>=12?'disabled':'')+'>&#8250;</button>'+
      '<button class="date-nav__today" data-action="goto-today">今日</button>'+
    '</div><div class="date-strip">';
    for(var i=0;i<7;i++){
      var d=addDays(new Date(),state.weekOffset*7+i),key=toKey(d);
      html+='<button class="day-chip '+(key===todayKey()?'is-today':'')+' '+(key===state.selectedDate?'is-selected':'')+'" data-action="select-date" data-date="'+key+'">'+
        '<span class="day-chip__wd">'+WEEKDAYS[d.getDay()]+'</span>'+
        '<span class="day-chip__d">'+d.getDate()+'</span>'+
      '</button>';
    }
    return html+'</div><div class="selected-date-label">'+fmtLabel(state.selectedDate)+'　の空き状況</div>';
  }

  function renderModelRow(){
    return '<div class="model-row">'+
      Object.keys(MODEL_LABEL).map(function(m){
        return '<button class="model-pill '+(state.rentalModel===m?'is-active':'')+'" data-action="switch-model" data-model="'+m+'">'+
          MODEL_LABEL[m]+(m==='seat2'?'<span class="model-pill__note">午前・午後のみ</span>':'')+
        '</button>';
      }).join('')+
    '</div>';
  }

  function renderBerths(used,cap){
    var h='<div class="berths">';
    for(var i=0;i<cap;i++) h+='<span class="berth '+(i<used?'berth--full':'')+'"></span>';
    return h+'</div>';
  }

  function renderSlots(){
    var type=state.tab,isPast=state.selectedDate<todayKey();
    if(type==='storage'){
      var used=state.bookings.storage.filter(function(b){return b.date===state.selectedDate;}).length;
      var congLabel,congClass;
      if(used>=20){congLabel='混雑';congClass='is-busy';}
      else if(used>=10){congLabel='やや混雑';congClass='is-moderate';}
      else{congLabel='空いています';congClass='is-open';}
      var bars='<div class="cong-bars">';
      for(var i=0;i<5;i++){
        var filled = (used>=20&&i<5)||(used>=10&&i<3)||(used<10&&i<1);
        bars+='<span class="cong-bar '+(filled?congClass:'')+'"></span>';
      }
      bars+='</div>';
      return '<div class="slots"><div class="slot-card">'+
        '<div class="slot-card__head">'+
          '<span class="slot-card__label">揚降受付</span>'+
          '<span class="slot-card__remaining '+congClass+'">'+congLabel+'</span>'+
        '</div>'+
        bars+
        '<div class="cong-count">本日の予約件数：'+used+'組</div>'+
        '<button class="btn btn--primary btn--block" data-action="open-book" data-slot="visit" '+(isPast?'disabled':'')+'>'+(isPast?'受付終了':'予約する（来店時刻を選択）')+'</button>'+
      '</div></div>';
    }
    var model=state.rentalModel,html='<div class="slots">';
    MODEL_SLOTS[model].forEach(function(slot){
      var rem=getRemaining(type,model,state.selectedDate,slot);
      var used=getUsed(type,model,state.selectedDate,slot);
      var cap=getCapacity(type,model),full=rem<=0;
      html+='<div class="slot-card">'+
        '<div class="slot-card__head">'+
          '<span class="slot-card__label">'+SLOT_LABEL[slot]+'</span>'+
          '<span class="slot-card__remaining '+(full?'is-full':'is-open')+'">'+(full?'満席':'空き '+rem)+'</span>'+
        '</div>'+
        renderBerths(used,cap)+
        '<button class="btn btn--primary btn--block" data-action="open-book" data-slot="'+slot+'" '+((full||isPast)?'disabled':'')+'>'+(isPast?'受付終了':'予約する')+'</button>'+
      '</div>';
    });
    return html+'</div>';
  }

  function renderBookingList(){
    var type=state.tab,model=type==='rental'?state.rentalModel:null;
    var list=state.bookings[type].filter(function(b){
      return b.date===state.selectedDate&&(type!=='rental'||b.model===model);
    });
    if(type==='storage') list.sort(function(a,b){return (a.time||'').localeCompare(b.time||'');});
    else{ var o={am:0,pm:1,day:2}; list.sort(function(a,b){return o[a.slot]-o[b.slot];}); }
    var html='<div class="section-title">この日の予約一覧'+(type==='rental'?'（'+MODEL_LABEL[model]+'）':'')+'</div>';
    if(!list.length) return html+'<div class="empty-note">まだ予約はありません。</div>';

    // レンタルの場合：予約日の1週間前（7日前）を過ぎているかチェック
    var isWithinWeek = false;
    if(type==='rental'){
      var p=state.selectedDate.split('-');
      var bookDate=new Date(+p[0],+p[1]-1,+p[2]);
      var deadline=new Date(bookDate);
      deadline.setDate(deadline.getDate()-7);
      isWithinWeek = new Date() > deadline; // 今日がデッドラインを超えていたら電話のみ
    }

    html+='<div class="booking-list">';
    list.forEach(function(b){
      var badge=type==='storage'?(b.time||'--:--'):SLOT_LABEL[b.slot];
      html+='<div class="booking-row">'+
        '<span class="booking-row__slot">'+badge+'</span>'+
        '<div class="booking-row__main">'+
          '<div class="booking-row__name">'+escapeHtml(b.name)+'</div>'+
          '<div class="booking-row__meta">'+escapeHtml(b.phone)+
          (type==='rental'&&b.guests?'　・　同伴者 '+b.guests+'名':'')+
          (type==='storage'&&b.gas?'　・　'+escapeHtml(b.gas):'　')+
          (type==='storage'&&b.wash?'　・　洗艇：'+escapeHtml(b.wash):'')+
          (b.options&&b.options.length?'<div class="booking-row__opts">'+b.options.map(function(o){return '<span class="opt-tag">'+escapeHtml(o)+'</span>';}).join('')+'</div>':'')+
          '</div>'+
        '</div>';
      if(type==='rental' && isWithinWeek){
        // 1週間以内：電話キャンセルのみ
        html+='<a href="tel:0569370039" class="cancel-tel">📞 電話<br>キャンセル</a>';
      } else if(state.confirmingCancelId===b.id){
        html+='<div class="confirm-box"><span>取消す？</span>'+
          '<button class="btn btn--danger btn--sm" data-action="confirm-cancel" data-id="'+b.id+'">削除</button>'+
          '<button class="btn btn--ghost btn--sm" data-action="abort-cancel">戻る</button></div>';
      } else {
        html+='<button class="btn btn--ghost btn--sm" data-action="ask-cancel" data-id="'+b.id+'">キャンセル</button>';
      }
      html+='</div>';
    });

    if(type==='rental' && isWithinWeek){
      html+='<div class="cancel-notice">'+
        '⚠️ 予約日まで1週間を切っています。キャンセルはお電話にて承ります。<br>'+
        '<a href="tel:0569370039" class="cancel-tel-link">📞 0569-37-0039</a>'+
      '</div>';
    }

    return html+'</div>';
  }

  var RENTAL_OPTIONS = [
    'トーイングチューブ 1人乗り',
    'トーイングチューブ 2人乗り',
    'ウエイクボードセット',
    'ウエイクサーフィンセット'
  ];

  function renderModal(){
    var type=state.tab,model=type==='rental'?state.rentalModel:null;
    var subLabel=type==='storage'?'来店時刻をご指定ください':SLOT_LABEL[state.modal.slot];
    var optionsHtml='';
    if(type==='rental'){
      optionsHtml='<div class="field"><label>オプション（複数選択可）</label>'+
        '<div class="options-grid">'+
        RENTAL_OPTIONS.map(function(opt,i){
          return '<label class="opt-item">'+
            '<input type="checkbox" class="opt-cb" value="'+escapeHtml(opt)+'">'+
            '<span class="opt-label">'+escapeHtml(opt)+'</span>'+
          '</label>';
        }).join('')+
        '</div></div>';
    }
    return '<div class="overlay" data-action="close-modal">'+
      '<div class="modal" onclick="event.stopPropagation()">'+
        '<p class="modal__title">'+TAB_LABEL[type].bottom+(model?'　'+MODEL_LABEL[model]:'')+'の予約</p>'+
        '<p class="modal__sub">'+fmtLabel(state.selectedDate)+'　'+subLabel+'</p>'+
        (type==='storage'?
          '<div class="field field--req"><label>来店予定時刻（9:00〜15:00）</label><input type="time" id="f-time" step="300" min="09:00" max="15:00"></div>'+
          '<div class="field field--req"><label>お名前</label><input type="text" id="f-name" placeholder="山田 太郎"></div>'+
          '<div class="field field--req"><label>電話番号</label><input type="tel" id="f-phone" placeholder="090-0000-0000"></div>'+
          '<div class="field field--req"><label>ガソリン</label>'+
            '<div class="select-group" id="f-gas">'+
              '<label class="sel-item"><input type="radio" name="gas" value="ハイオク給油（サーガラ）"><span class="sel-label">サーガラで給油（ハイオク）</span></label>'+
              '<label class="sel-item"><input type="radio" name="gas" value="レギュラー給油（サーガラ）"><span class="sel-label">サーガラで給油（レギュラー）</span></label>'+
              '<label class="sel-item"><input type="radio" name="gas" value="燃料持ち込み"><span class="sel-label">燃料持ち込み</span></label>'+
            '</div>'+
          '</div>'+
          '<div class="field field--req"><label>洗艇</label>'+
            '<div class="select-group" id="f-wash">'+
              '<label class="sel-item"><input type="radio" name="wash" value="サーガラに洗艇を依頼（8,800円）"><span class="sel-label">サーガラに洗艇を依頼（8,800円）</span></label>'+
              '<label class="sel-item"><input type="radio" name="wash" value="希望しない"><span class="sel-label">希望しない</span></label>'+
            '</div>'+
          '</div>'+
          '<div class="field"><label>メモ・備考（任意）</label><textarea id="f-note" placeholder="ご要望があればご記入ください"></textarea></div>'
        :
          '<div class="field field--req"><label>お名前</label><input type="text" id="f-name" placeholder="山田 太郎"></div>'+
          '<div class="field field--req"><label>電話番号</label><input type="tel" id="f-phone" placeholder="090-0000-0000"></div>'
        )+

  function renderMyBookings(){
    var m=state.currentMember;
    var allBookings=[];
    state.bookings.storage.forEach(function(b){
      if(b.name===m.name&&b.phone===m.phone) allBookings.push({type:'storage',b:b});
    });
    state.bookings.rental.forEach(function(b){
      if(b.name===m.name&&b.phone===m.phone) allBookings.push({type:'rental',b:b});
    });
    // 日付の新しい順
    allBookings.sort(function(a,b){return b.b.date.localeCompare(a.b.date);});

    if(!allBookings.length){
      return '<div class="mypage-empty">予約はまだありません。</div>';
    }
    var today=todayKey();
    var html='<div class="mypage-section">';
    allBookings.forEach(function(item){
      var b=item.b,type=item.type;
      var p=b.date.split('-');
      var bDate=new Date(+p[0],+p[1]-1,+p[2]);
      var deadline=new Date(bDate);deadline.setDate(deadline.getDate()-7);
      var canCancel=new Date()<=deadline&&b.date>=today;
      var statusLabel=b.confirmed?'確定済み':'仮予約中';
      var statusClass=b.confirmed?'confirmed':'pending';
      var typeLabel=type==='storage'?'揚降':'レンタル';
      var typeClass=type==='storage'?'storage':'rental';
      var slotLabel='';
      if(type==='rental') slotLabel=({am:'午前',pm:'午後',day:'一日'}[b.slot]||b.slot)+'　'+({seat2:'2人乗り',seat3:'3人乗り'}[b.model]||'');
      if(type==='storage') slotLabel=b.time||'';
      var cancelling=state.myConfirmCancel===b.id;
      html+='<div class="mypage-card">'+
        '<div class="mypage-card__head">'+
          '<span class="mypage-card__type mypage-card__type--'+typeClass+'">'+typeLabel+'</span>'+
          '<span class="mypage-card__status mypage-card__status--'+statusClass+'">'+statusLabel+'</span>'+
        '</div>'+
        '<div class="mypage-card__date">'+fmtLabel(b.date)+'</div>'+
        '<div class="mypage-card__detail">'+slotLabel+
          (type==='storage'&&b.gas?'　／　'+escapeHtml(b.gas):'')+
          (type==='storage'&&b.wash?'　／　'+escapeHtml(b.wash):'')+
          (type==='rental'&&b.guests?'　同伴者 '+b.guests+'名':'')+
          (b.options&&b.options.length?'<br>'+b.options.join('、'):'')+
          (b.note?'<br>備考：'+escapeHtml(b.note):'')+
        '</div>'+
        '<div class="mypage-card__actions">';
      if(b.date<today){
        html+='<span style="font-size:11px;color:var(--text-muted);">終了した予約</span>';
      } else if(cancelling){
        html+='<span style="font-size:12px;color:var(--danger);font-weight:700;">取消しますか？</span>'+
          '<button class="btn btn--danger btn--sm" data-action="my-do-cancel" data-type="'+type+'" data-id="'+b.id+'">削除</button>'+
          '<button class="btn btn--ghost btn--sm" data-action="my-abort-cancel">戻る</button>';
      } else if(canCancel){
        html+='<button class="btn btn--ghost btn--sm" data-action="my-ask-cancel" data-id="'+b.id+'">キャンセル</button>';
      } else {
        html+='<a href="tel:0569370039" class="cancel-tel" style="font-size:11px;">📞 電話でキャンセル<br>0569-37-0039</a>';
      }
      html+='</div></div>';
    });
    return html+'</div>';
  }

  function renderAdminCalendar(){
    var cm=getAdminCalMonth();
    var year=cm.year,month=cm.month;
    var firstDay=new Date(year,month,1).getDay();
    var daysInMonth=new Date(year,month+1,0).getDate();
    var today=todayKey();
    var html='<div class="cal-nav">'+
      '<button class="cal-nav__arrow" data-action="cal-prev">&#8249;</button>'+
      '<span class="cal-nav__label">'+(year)+'年'+(month+1)+'月</span>'+
      '<button class="cal-nav__arrow" data-action="cal-next">&#8250;</button>'+
    '</div>'+
    '<div class="cal-grid">'+
    ['日','月','火','水','木','金','土'].map(function(d){return '<div class="cal-wd">'+d+'</div>';}).join('');

    // 空白セル
    for(var i=0;i<firstDay;i++) html+='<div class="cal-cell is-empty"></div>';

    for(var d=1;d<=daysInMonth;d++){
      var key=year+'-'+String(month+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
      var sCount=state.bookings.storage.filter(function(b){return b.date===key;}).length;
      var rCount=state.bookings.rental.filter(function(b){return b.date===key;}).length;
      var isToday=key===today;
      var isSel=key===state.adminDayDate;
      html+='<div class="cal-cell '+(isToday?'is-today':'')+' '+(isSel?'is-selected':'')+'" data-action="adm-day" data-date="'+key+'">'+
        '<span class="cal-cell__d">'+d+'</span>'+
        '<div class="cal-dots">'+
        (sCount>0?'<div class="cal-dot cal-dot--storage">揚降 '+sCount+'件</div>':'')+
        (rCount>0?'<div class="cal-dot cal-dot--rental">レンタル '+rCount+'件</div>':'')+
        '</div>'+
      '</div>';
    }
    return html+'</div>';
  }

  function renderAdminDay(){

            '<button class="btn btn--ghost btn--sm" data-action="adm-abort-cancel">戻る</button>'
          )+

        '</div>';
      });

    // レンタル
    html+='<div class="adm-section-label">レンタル予約（'+rBookings.length+'件）</div>';

            '<span style="font-size:12px;color:var(--gold);font-weight:700;">'+modelLabel+'　'+slotLabel+'</span>'+

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});
  }
  function showToast(msg, type){
    var t=document.createElement('div');
    t.className='toast'+(type==='success'?' toast--success':'');
    t.textContent=msg;
    document.body.appendChild(t);
    requestAnimationFrame(function(){t.classList.add('show');});
    setTimeout(function(){t.classList.remove('show');setTimeout(function(){t.remove();},300);},3000);
  }

  app.addEventListener('click',function(e){
    var el=e.target.closest('[data-action]');if(!el) return;
    var a=el.dataset.action;
    if(a==='switch-tab'){state.tab=el.dataset.tab;state.confirmingCancelId=null;render();}
    else if(a==='switch-model'){state.rentalModel=el.dataset.model;state.confirmingCancelId=null;render();}
    else if(a==='prev-week'){if(state.weekOffset>0){state.weekOffset--;render();}}
    else if(a==='next-week'){if(state.weekOffset<12){state.weekOffset++;render();}}
    else if(a==='goto-today'){state.weekOffset=0;state.selectedDate=todayKey();render();}
    else if(a==='select-date'){state.selectedDate=el.dataset.date;render();}
    else if(a==='open-book'){state.modal={slot:el.dataset.slot};render();}
    else if(a==='close-modal'){state.modal=null;render();}
    else if(a==='submit-booking'){handleSubmit();}
    else if(a==='ask-cancel'){state.confirmingCancelId=el.dataset.id;render();}
    else if(a==='abort-cancel'){state.confirmingCancelId=null;render();}
    else if(a==='confirm-cancel'){handleCancel(el.dataset.id);}
    else if(a==='open-mypage'){state.myPageOpen=true;state.authError='';render();}
    else if(a==='close-mypage'){state.myPageOpen=false;state.myConfirmCancel=null;render();}
    else if(a==='auth-view'){state.authView=el.dataset.view;render();}
    else if(a==='do-login'){handleLogin();}
    else if(a==='do-register'){handleRegister();}
    else if(a==='do-logout'){handleLogout();}
    else if(a==='mypage-view'){state.myPageView=el.dataset.view;render();}
    else if(a==='my-ask-cancel'){state.myConfirmCancel=el.dataset.id;render();}
    else if(a==='my-abort-cancel'){state.myConfirmCancel=null;render();}
    else if(a==='my-do-cancel'){handleMyCancel(el.dataset.type,el.dataset.id);}
    else if(a==='open-admin'){state.adminOpen=true;state.adminLogin=false;state.adminLoginError='';state.adminPwSection=false;state.adminView='calendar';render();}
    else if(a==='adm-view'){state.adminView=el.dataset.view;render();}
    else if(a==='cal-prev'){var m=getAdminCalMonth();var nd=new Date(m.year,m.month-1,1);state.adminCalMonth={year:nd.getFullYear(),month:nd.getMonth()};render();}
    else if(a==='cal-next'){var m=getAdminCalMonth();var nd=new Date(m.year,m.month+1,1);state.adminCalMonth={year:nd.getFullYear(),month:nd.getMonth()};render();}
    else if(a==='adm-day'){state.adminDayDate=el.dataset.date;state.adminView='day';state.adminConfirmCancel=null;render();}
    else if(a==='adm-back'){state.adminView='calendar';state.adminConfirmCancel=null;render();}
    else if(a==='adm-confirm'){handleAdminConfirm(el.dataset.type,el.dataset.id);}
    else if(a==='adm-ask-cancel'){state.adminConfirmCancel=el.dataset.id;render();}
    else if(a==='adm-abort-cancel'){state.adminConfirmCancel=null;render();}
    else if(a==='adm-do-cancel'){handleAdminCancel(el.dataset.type,el.dataset.id);}
    else if(a==='close-admin'){state.adminOpen=false;state.adminLogin=false;state.adminPwSection=false;render();}
    else if(a==='admin-logout'){state.adminLogin=false;state.adminPwSection=false;render();}
    else if(a==='do-admin-login'){handleAdminLogin();}
    else if(a==='save-settings'){handleSaveSettings();}
    else if(a==='open-pw-section'){state.adminPwSection=true;render();}
    else if(a==='close-pw-section'){state.adminPwSection=false;render();}
    else if(a==='save-admin-pw'){handleSaveAdminPw();}
  });

  // 同伴者カウンター：モーダルはapp外に挿入されるためdocumentで受ける
  document.addEventListener('click', function(e){
    var btn = e.target.closest('[data-counter]');
    if(!btn) return;
    e.stopPropagation();
    var valEl = document.getElementById('f-guests-val');
    var hidEl = document.getElementById('f-guests');
    if(!valEl || !hidEl) return;
    var cur = parseInt(hidEl.value) || 0;
    cur = btn.dataset.counter === 'plus' ? cur + 1 : Math.max(0, cur - 1);
    hidEl.value = cur;
    valEl.textContent = cur;
  }, true); // capture=trueで確実に拾う

  function handleSubmit(){
    var type=state.tab;
    var name=(document.getElementById('f-name')||{value:''}).value.trim();
    var phone=(document.getElementById('f-phone')||{value:''}).value.trim();
    var note=(document.getElementById('f-note')||{value:''}).value.trim();
    var errEl=document.getElementById('f-error');
    var timeEl=document.getElementById('f-time');
    var time=timeEl?timeEl.value:null;
    var timeInvalid=type==='storage'&&time&&(time<'09:00'||time>'15:00');

    // 揚降: ガソリン・洗艇のバリデーション
    var gasEl=document.querySelector('input[name="gas"]:checked');
    var washEl=document.querySelector('input[name="wash"]:checked');
    var gas=gasEl?gasEl.value:null;
    var wash=washEl?washEl.value:null;

    var storageInvalid=type==='storage'&&(!time||timeInvalid||!gas||!wash);
    if(!name||!phone||storageInvalid){
      errEl.style.display='block';
      if(type==='storage'&&name&&phone&&time&&(!gas||!wash)){
        errEl.textContent='ガソリンと洗艇の選択をご確認ください。';
      } else {
        errEl.textContent='すべての必須項目をご選択・ご入力ください。';
      }
      return;
    }
    errEl.style.display='none';

    var booking={
      id:Date.now().toString(36)+Math.random().toString(36).slice(2,7),
      date:state.selectedDate,name:name,phone:phone,note:note,
      createdAt:new Date().toISOString()
    };
    if(type==='rental'){
      var cbs=document.querySelectorAll('.opt-cb:checked');
      var opts=[];
      for(var i=0;i<cbs.length;i++) opts.push(cbs[i].value);
      if(opts.length) booking.options=opts;
      var gEl=document.getElementById('f-guests');
      booking.guests=gEl?parseInt(gEl.value)||0:0;
    }
    if(type==='storage'){
      booking.time=time;
      booking.gas=gas;
      booking.wash=wash;
    } else {
      var model=state.rentalModel,slot=state.modal.slot;
      if(getRemaining(type,model,state.selectedDate,slot)<=0){showToast('ちょうど満席になりました');state.modal=null;render();return;}
      booking.slot=slot;booking.model=model;
    }
    state.bookings[type].push(booking);
    state.modal=null;render();
    saveBookings();showToast('ご予約が完了しました', 'success');
  }

  function handleCancel(id){
    var type=state.tab;
    state.bookings[type]=state.bookings[type].filter(function(b){return b.id!==id;});
    state.confirmingCancelId=null;render();
    saveBookings();showToast('予約を取消しました');
  }


  function handleLogin(){
    var email=(document.getElementById('au-email')||{value:''}).value.trim().toLowerCase();
    var pw=(document.getElementById('au-pw')||{value:''}).value;
    var errEl=document.getElementById('au-err');
    if(!email||!pw){if(errEl)errEl.style.display='block';return;}
    sha256(pw).then(function(pwHash){
      var found=state.members.filter(function(m){return m.email.toLowerCase()===email&&m.pwHash===pwHash;})[0];
      if(!found){if(errEl)errEl.style.display='block';return;}
      state.currentMember=found;
      render();
      saveSession(found.id);
      showToast('ログインしました');
    });
  }

  function handleRegister(){
    var name=(document.getElementById('au-name')||{value:''}).value.trim();
    var phone=(document.getElementById('au-phone')||{value:''}).value.trim();
    var email=(document.getElementById('au-email-r')||{value:''}).value.trim().toLowerCase();
    var pw=(document.getElementById('au-pw-r')||{value:''}).value;
    var errEl=document.getElementById('au-err-r');
    if(!name||!phone||!email||pw.length<6||email.indexOf('@')===-1){
      if(errEl){errEl.textContent='すべての項目を正しくご入力ください（パスワードは6文字以上）';errEl.style.display='block';}return;
    }
    var dup=state.members.filter(function(m){return m.email.toLowerCase()===email;})[0];
    if(dup){
      if(errEl){errEl.textContent='このメールアドレスはすでに登録されています';errEl.style.display='block';}
      state.authView='login';render();return;
    }
    sha256(pw).then(function(pwHash){
      var member={
        id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),
        name:name,phone:phone,email:email,pwHash:pwHash,
        createdAt:new Date().toISOString()
      };
      state.members.push(member);
      state.currentMember=member;
      render();
      saveMembers();saveSession(member.id);
      showToast('会員登録が完了しました','success');
    });
  }

  function handleLogout(){
    state.currentMember=null;
    state.myPageOpen=false;
    state.authView='login';
    render();
    clearSession();
  }

  function handleMyCancel(type,id){
    state.bookings[type]=state.bookings[type].filter(function(b){return b.id!==id;});
    state.myConfirmCancel=null;render();
    saveBookings();showToast('予約を取消しました');
  }

  function handleAdminConfirm(type, id){
    var list=state.bookings[type];
    for(var i=0;i<list.length;i++){
      if(list[i].id===id){ list[i].confirmed=true; break; }
    }
    render();
    saveBookings();showToast('予約を確定しました');
  }

  function handleAdminCancel(type, id){
    state.bookings[type]=state.bookings[type].filter(function(b){return b.id!==id;});
    state.adminConfirmCancel=null;render();
    saveBookings();showToast('予約を取消しました');
  }

  function handleAdminLogin(){
    var id=(document.getElementById('adm-id')||{value:''}).value.trim();
    var pw=(document.getElementById('adm-pw')||{value:''}).value;
    if(!id||!pw){ document.getElementById('adm-err').style.display='block'; return; }
    Promise.all([sha256(id), sha256(pw)]).then(function(hashes){
      if(hashes[0]===state.admin.id && hashes[1]===state.admin.pw){
        state.adminLogin=true; render();
      } else {
        document.getElementById('adm-err').style.display='block';
      }
    });
  }

  function handleSaveAdminPw(){
    var curId=(document.getElementById('pw-cur-id')||{value:''}).value.trim();
    var curPw=(document.getElementById('pw-cur-pw')||{value:''}).value;
    var newId=(document.getElementById('pw-new-id')||{value:''}).value.trim();
    var newPw=(document.getElementById('pw-new-pw')||{value:''}).value;
    var errEl=document.getElementById('pw-err');
    if(!newId||!newPw){ errEl.textContent='新しいIDとパスワードを入力してください'; errEl.style.display='block'; return; }
    // 現在のID・PWをハッシュ照合してから新しい値をハッシュ保存
    Promise.all([sha256(curId), sha256(curPw)]).then(function(curHashes){
      if(curHashes[0]!==state.admin.id || curHashes[1]!==state.admin.pw){
        errEl.textContent='現在のIDまたはパスワードが違います'; errEl.style.display='block'; return;
      }
      return Promise.all([sha256(newId), sha256(newPw)]).then(function(newHashes){
        state.admin={id:newHashes[0], pw:newHashes[1]};
        lsSet(ADMIN_KEY, JSON.stringify(state.admin));
        state.adminPwSection=false; render();
        showToast('管理者情報を変更しました');
      });
    });
  }

  function handleSaveSettings(){
    var r2=parseInt((document.getElementById('s-rental2')||{value:''}).value,10);
    var r3=parseInt((document.getElementById('s-rental3')||{value:''}).value,10);
    state.settings.rental2Capacity=isNaN(r2)?state.settings.rental2Capacity:Math.max(0,r2);
    state.settings.rental3Capacity=isNaN(r3)?state.settings.rental3Capacity:Math.max(0,r3);
    render();
    saveSettings();showToast('設定を保存しました');
  }

  loadData();
  state.loaded=true;
  render();
})();
</script>
</body>
</html>
